  <ellipse cx="760" cy="680" rx="470" ry="68" fill="#2A9CB4" opacity=".12" filter="url(#blur)"/>
  <ellipse cx="750" cy="685" rx="420" ry="28" fill="#9CB7E8" opacity=".15" filter="url(#softShadow)"/>
