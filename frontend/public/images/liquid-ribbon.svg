    <!-- Traveling highlights follow the ribbon's curved paths in staggered directions. -->
    <path class="ribbon-current ribbon-current-top" d="M275 300C303 198 401 148 512 183C622 218 680 322 794 310C913 297 985 187 1091 201C1175 213 1222 285 1203 347" stroke="url(#edge)" stroke-width="13" stroke-dasharray="66 610" stroke-linecap="round" opacity=".8"/>
    <path class="ribbon-current ribbon-current-bottom" d="M294 415C382 501 466 525 531 534C609 546 650 525 719 565C797 610 840 671 916 665C980 659 986 612 1027 561" stroke="#d8fbff" stroke-width="14" stroke-dasharray="82 580" stroke-linecap="round" opacity=".72"/>
