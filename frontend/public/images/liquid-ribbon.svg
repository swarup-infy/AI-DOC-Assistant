  <path d="M168 692C391 655 551 715 729 701C902 687 1083 634 1251 671" stroke="#8EDDF0" stroke-opacity=".12" stroke-width="2"/>
  <style>
    #ribbon { animation: drift 12s ease-in-out infinite alternate; }
    .ribbon-current { animation-iteration-count: infinite; animation-timing-function: linear; }
    .ribbon-current-top { animation: ribbon-current-forward 6.4s linear infinite; }
    .ribbon-current-bottom { animation: ribbon-current-reverse 7.8s linear infinite; }
    @keyframes ribbon-current-forward { from { stroke-dashoffset: 676; } to { stroke-dashoffset: 0; } }
    @keyframes ribbon-current-reverse { from { stroke-dashoffset: 0; } to { stroke-dashoffset: 662; } }
    @keyframes drift { from { transform: translate(-9px, 5px) rotate(-1deg); } to { transform: translate(10px, -8px) rotate(1deg); } }
    @media (prefers-reduced-motion: reduce) { #ribbon, .ribbon-current { animation: none !important; } }
  </style>
</svg>