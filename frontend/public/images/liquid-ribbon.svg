    <path d="M354 319C364 256 425 222 492 246C573 276 618 367 719 376C830 388 892 279 1000 279C1083 279 1136 335 1105 396C1080 445 1016 457 966 500C907 552 916 594 869 604C810 617 761 556 704 523C639 486 586 500 520 466C430 420 343 390 354 319Z" fill="url(#shade)"/>
