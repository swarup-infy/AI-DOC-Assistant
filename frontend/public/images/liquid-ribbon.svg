    <path d="M492 462C562 492 626 478 688 514C746 547 785 597 841 612" stroke="#56DDEB" stroke-width="3" stroke-linecap="round" opacity=".72"/>
    <path d="M1067 221C1134 232 1175 274 1179 318" stroke="#A8F7FF" stroke-width="3" stroke-linecap="round" opacity=".8"/>
