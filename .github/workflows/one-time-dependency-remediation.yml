name: One-time dependency remediation

on:
  push:
    branches:
      - feat/refined-auth-experience

permissions:
  contents: write

jobs:
  update-npm-lock:
    if: ${{ !contains(github.event.head_commit.message, '[audit-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: feat/refined-auth-experience
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply compatible security updates
        working-directory: frontend
        run: npm audit fix
      - name: Commit updated npm lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "[audit-bot] update vulnerable npm dependencies"
          git push origin HEAD:feat/refined-auth-experience
