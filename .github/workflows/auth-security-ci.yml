name: Authentication and security checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: sqlite+pysqlite:///:memory:
      SECRET_KEY: unit-test-secret-key-that-is-long-enough-for-testing
      GROQ_API_KEY: unit-test-key-not-valid-for-provider
      ENVIRONMENT: testing
      DEBUG: "false"
      BACKEND_CORS_ORIGINS: '["http://localhost:5173"]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run security unit tests
        run: pytest -q
      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt

  frontend:
    name: Frontend lint, typecheck, build, and dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Production build and TypeScript check
        run: npm run build
      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=high
