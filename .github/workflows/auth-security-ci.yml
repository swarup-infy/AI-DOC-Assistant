name: Authentication and security checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg2://test:test@127.0.0.1:5432/test_auth
      SECRET_KEY: unit-test-secret-key-that-is-long-enough-for-testing
      GROQ_API_KEY: unit-test-key-not-valid-for-provider
      ENVIRONMENT: testing
      DEBUG: "false"
      BACKEND_CORS_ORIGINS: '["http://localhost:5173"]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run security unit tests
        run: pytest -q
      - name: Audit Python dependencies (documented upstream exceptions)
        run: >-
          pip-audit -r requirements.txt
          --ignore-vuln GHSA-p4wg-p73j-c528
          --ignore-vuln GHSA-65qm-jvmh-6pqg
          --ignore-vuln GHSA-58r4-6rv3-gfh8
          --ignore-vuln GHSA-pchr-8j38-3x4p
          --ignore-vuln GHSA-q45j-58j2-45rg
          --ignore-vuln GHSA-462x-pgg6-55fp
          --ignore-vuln GHSA-c6hw-5grf-ff96
          --ignore-vuln GHSA-vx6w-vv9f-6gvg
          --ignore-vuln GHSA-7mwm-ghpf-9vrm
          --ignore-vuln GHSA-w889-685w-c8fh
          --ignore-vuln GHSA-j4m9-6w36-pw47
          --ignore-vuln GHSA-27h8-gf7j-v5hc
          --ignore-vuln GHSA-fc9g-5qg7-mf45
          --ignore-vuln GHSA-cp9v-662q-vvx9
          --ignore-vuln GHSA-22hg-r758-rrw9
          --ignore-vuln GHSA-74r2-7ff9-mjj2
          --ignore-vuln GHSA-xgh8-jp6q-p5x8
          --ignore-vuln GHSA-254f-3936-288h
          --ignore-vuln GHSA-jg86-v3jv-hrpm
          --ignore-vuln GHSA-f2g6-542v-9j58
          --ignore-vuln GHSA-5xm2-6676-qcp9
          --ignore-vuln GHSA-gg2r-wvfm-q9rx
          --ignore-vuln GHSA-332p-7hrc-92wf
          --ignore-vuln GHSA-4rr5-89j8-mwwm
          --ignore-vuln GHSA-24rc-8hj2-v98c
          --ignore-vuln GHSA-4rm8-3hmm-39fg
          --ignore-vuln GHSA-mrfp-p49p-3hf2
          --ignore-vuln GHSA-3j72-p6qg-6xp7
          --ignore-vuln GHSA-v9pv-5gc8-w2m6
          --ignore-vuln GHSA-g4qv-2jxx-769h
          --ignore-vuln GHSA-g842-9rc4-69pw
          --ignore-vuln GHSA-9v9v-9qvf-h2hj
          --ignore-vuln GHSA-g7cr-3p24-7wf7
          --ignore-vuln GHSA-p8hx-v2p6-rp84
          --ignore-vuln GHSA-78g4-xqwv-q3g8
          --ignore-vuln PYSEC-2026-311
          --ignore-vuln PYSEC-2026-3814
          --ignore-vuln PYSEC-2026-3815
          --ignore-vuln PYSEC-2026-3813
          --ignore-vuln PYSEC-2026-4327
          --ignore-vuln GHSA-654x-cwwv-5j9c
          --ignore-vuln GHSA-5x8w-8jj5-q52h

  frontend:
    name: Frontend lint, typecheck, build, and dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Production build and TypeScript check
        run: npm run build
      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=high

  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository history and working tree
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
